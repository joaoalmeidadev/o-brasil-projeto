services:
  postgres:
    image: postgres:16-alpine
    container_name: brasil-nao-aguenta-mais-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: brasil_nao_aguenta_mais
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d brasil_nao_aguenta_mais']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
